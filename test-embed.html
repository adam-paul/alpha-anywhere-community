<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alpha Arcade - Embed Test</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #1a1a2e;
      color: #ffffff;
      min-height: 100vh;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 1rem;
    }

    .description {
      text-align: center;
      color: #888;
      margin-bottom: 2rem;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .embed-container {
      max-width: 1200px;
      margin: 0 auto 2rem;
      background: #ffffff;
      border: 4px solid #333;
    }

    iframe {
      width: 100%;
      height: 700px;
      border: none;
      display: block;
    }

    .controls {
      max-width: 600px;
      margin: 0 auto;
      background: #2a2a3e;
      padding: 1.5rem;
      border: 2px solid #444;
    }

    .controls h2 {
      margin-top: 0;
      font-size: 0.875rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #888;
      margin-bottom: 1rem;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .control-row label {
      flex: 0 0 120px;
      font-size: 0.875rem;
    }

    .control-row input,
    .control-row select {
      flex: 1;
      padding: 0.5rem;
      border: 2px solid #444;
      background: #1a1a2e;
      color: #fff;
      font-family: inherit;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: #3b82f6;
      color: white;
      border: 2px solid #1d4ed8;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
    }

    button:hover {
      background: #2563eb;
    }

    .event-log {
      max-width: 600px;
      margin: 2rem auto 0;
      background: #0a0a0a;
      border: 2px solid #333;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.75rem;
      max-height: 200px;
      overflow-y: auto;
    }

    .event-log h3 {
      margin-top: 0;
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #666;
    }

    .event-log .event {
      padding: 0.25rem 0;
      border-bottom: 1px solid #222;
      color: #10b981;
    }

    .event-log .event:last-child {
      border-bottom: none;
    }

    .event-log .event-time {
      color: #666;
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Alpha Arcade - Embed Test</h1>
  <p class="description">
    This page simulates embedding the Arcade widget in a host application.
    The iframe below loads the widget, and postMessage events are logged.
  </p>

  <div class="embed-container">
    <iframe id="arcade-frame" src="http://localhost:5173"></iframe>
  </div>

  <div class="controls">
    <h2>Host App Controls</h2>

    <div class="control-row">
      <label for="user-name">User Name:</label>
      <input type="text" id="user-name" value="Test Student">
    </div>

    <div class="control-row">
      <label for="xp-current">XP Current:</label>
      <input type="number" id="xp-current" value="75" min="0" max="200">
    </div>

    <div class="control-row">
      <label for="xp-required">XP Required:</label>
      <input type="number" id="xp-required" value="150" min="1" max="500">
    </div>

    <div class="control-row">
      <label for="gating-mode">Gating Mode:</label>
      <select id="gating-mode">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
      </select>
    </div>

    <button onclick="sendConfig()">Send Config to Widget</button>
  </div>

  <div class="event-log">
    <h3>Event Log</h3>
    <div id="events"></div>
  </div>

  <script>
    const eventsContainer = document.getElementById('events');

    function logEvent(type, data) {
      const time = new Date().toLocaleTimeString();
      const event = document.createElement('div');
      event.className = 'event';
      event.innerHTML = `<span class="event-time">${time}</span> <strong>${type}</strong>: ${JSON.stringify(data)}`;
      eventsContainer.insertBefore(event, eventsContainer.firstChild);
    }

    // Listen for messages from the iframe
    window.addEventListener('message', (event) => {
      // In production, verify event.origin
      if (event.data && event.data.type) {
        logEvent(event.data.type, event.data);

        // Handle launch events
        if (event.data.type === 'launch') {
          logEvent('LAUNCH_INTERCEPTED', {
            message: 'Host app would navigate to: ' + event.data.launchUrl
          });
        }
      }
    });

    function sendConfig() {
      const iframe = document.getElementById('arcade-frame');
      const config = {
        type: 'config',
        userName: document.getElementById('user-name').value,
        xpCurrent: parseInt(document.getElementById('xp-current').value),
        xpRequired: parseInt(document.getElementById('xp-required').value),
        gatingMode: document.getElementById('gating-mode').value
      };

      iframe.contentWindow.postMessage(config, '*');
      logEvent('CONFIG_SENT', config);
    }

    // Log page load
    logEvent('PAGE_LOADED', { iframe: 'http://localhost:5173' });
  </script>
</body>
</html>
